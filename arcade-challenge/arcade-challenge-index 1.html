<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMSA Arcade Challenge</title><style>
:root{--n:#031329;--b:#062a5e;--c:#3debff;--m:#52ffd2;--v:#8c63ff;--p:#ff5ca8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#031329}body{color:#f8fdff;font-family:Arial,system-ui,sans-serif;background:radial-gradient(circle at 8% 2%,rgba(140,99,255,.4),transparent 30%),radial-gradient(circle at 92% 10%,rgba(255,92,168,.32),transparent 31%),radial-gradient(circle at 52% 48%,rgba(61,235,255,.11),transparent 37%),linear-gradient(155deg,#031329,#052047 60%,#031329);padding:2vh 2vw}.shell{max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:2vh}.brand{font-size:clamp(12px,1vw,17px);font-weight:900;letter-spacing:.3em;color:var(--c)}h1{font-size:clamp(38px,4.5vw,76px);line-height:.93;margin:.7vh 0;font-weight:1000;letter-spacing:-.045em}h1 span{color:var(--p);text-shadow:0 0 24px rgba(255,92,168,.48)}.sub{font-size:clamp(14px,1.15vw,20px);color:#a7cadb}.mascot{width:clamp(80px,8vw,135px);height:clamp(80px,8vw,135px);object-fit:contain;filter:drop-shadow(0 0 16px rgba(82,255,210,.45))}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,.7vw,12px)}.cat{height:clamp(72px,8vh,105px);display:flex;align-items:center;justify-content:center;border-radius:18px;background:rgba(6,42,94,.76);border:1px solid rgba(61,235,255,.42);box-shadow:0 0 22px rgba(61,235,255,.12),inset 0 0 20px rgba(61,235,255,.05);font-size:clamp(15px,1.5vw,25px);font-weight:1000;text-align:center;letter-spacing:.05em}.cat:nth-child(1){color:var(--m)}.cat:nth-child(2){color:var(--p)}.cat:nth-child(3){color:var(--c)}.cat:nth-child(4){color:#bcaaff}.tile{height:clamp(68px,9vh,115px);border-radius:16px;background:linear-gradient(180deg,rgba(61,235,255,.24) 0%,rgba(140,99,255,.22) 52%,rgba(255,92,168,.20) 100%),linear-gradient(145deg,#09244a,#04142d);border:1px solid rgba(61,235,255,.42);box-shadow:0 0 18px rgba(61,235,255,.11),inset 0 0 22px rgba(140,99,255,.08);font-size:clamp(27px,3vw,48px);font-weight:1000;color:#fff;cursor:pointer;transition:.14s}.tile:hover{transform:translateY(-2px);border-color:var(--m);box-shadow:0 0 26px rgba(82,255,210,.22),0 0 18px rgba(255,92,168,.12)}.tile[data-row="0"]{background:linear-gradient(180deg,rgba(61,235,255,.28),rgba(61,235,255,.12)),linear-gradient(145deg,#09244a,#04142d)}.tile[data-row="1"]{background:linear-gradient(180deg,rgba(61,235,255,.18),rgba(82,255,210,.15)),linear-gradient(145deg,#09244a,#04142d)}.tile[data-row="2"]{background:linear-gradient(180deg,rgba(82,255,210,.14),rgba(140,99,255,.20)),linear-gradient(145deg,#09244a,#04142d)}.tile[data-row="3"]{background:linear-gradient(180deg,rgba(140,99,255,.24),rgba(255,92,168,.14)),linear-gradient(145deg,#09244a,#04142d)}.tile[data-row="4"]{background:linear-gradient(180deg,rgba(255,92,168,.25),rgba(140,99,255,.18)),linear-gradient(145deg,#09244a,#04142d)}.tile.used{opacity:.23;pointer-events:none}.screen{display:none}.screen.active{display:block}.card{min-height:54vh;border-radius:28px;background:rgba(3,19,41,.93);border:1px solid rgba(61,235,255,.42);padding:clamp(25px,4vw,70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 65px rgba(61,235,255,.16),0 0 26px rgba(140,99,255,.1),inset 0 0 35px rgba(61,235,255,.04)}.label{font-weight:1000;letter-spacing:.2em;color:var(--p);font-size:clamp(12px,1vw,17px)}.pts{font-size:clamp(20px,2vw,31px);font-weight:1000;color:var(--m);margin-top:8px}.q{max-width:1200px;font-size:clamp(30px,3.5vw,58px);line-height:1.14;font-weight:1000;margin:3vh 0}.answer{width:min(1100px,100%);padding:clamp(20px,2vw,32px);border-radius:18px;background:rgba(82,255,210,.08);border:1px solid rgba(82,255,210,.34);font-size:clamp(23px,2.3vw,38px);font-weight:900}.answer b{color:var(--m)}.explain{max-width:950px;color:#bed7e2;font-size:clamp(16px,1.4vw,23px);line-height:1.45;margin:2vh 0}.primary,.dept{cursor:pointer;font-weight:1000;border-radius:14px;padding:14px 23px;font-size:clamp(14px,1.15vw,19px)}.primary{border:0;background:linear-gradient(90deg,var(--c),var(--m));color:var(--n)}.depts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.dept{min-width:145px;background:rgba(140,99,255,.14);border:1px solid rgba(140,99,255,.48);color:#e7e0ff}.dept:disabled,.primary:disabled{opacity:.45;cursor:not-allowed}.winner{font-size:clamp(42px,5vw,80px);font-weight:1000;color:var(--m);text-shadow:0 0 28px rgba(82,255,210,.34);margin:2vh 0}.status{min-height:24px;color:#bfefff;font-weight:800;margin-top:12px}.cup{margin-top:2vh;padding:14px 16px;border:1px solid rgba(61,235,255,.34);box-shadow:0 0 28px rgba(61,235,255,.10),0 0 26px rgba(255,92,168,.06);border-radius:18px;background:linear-gradient(90deg,rgba(140,99,255,.1),rgba(61,235,255,.08),rgba(255,92,168,.09))}.cuphead{font-size:clamp(11px,.9vw,15px);font-weight:1000;letter-spacing:.18em;color:var(--m);margin-bottom:9px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score{padding:11px 14px;border-radius:11px;background:rgba(3,19,41,.72);display:flex;justify-content:space-between;font-weight:900;font-size:clamp(12px,1.1vw,18px)}.score b{color:var(--m)}.back{margin-top:18px;background:none;border:0;color:#7bb7ce;cursor:pointer;font-weight:800}.spark{position:fixed;pointer-events:none;text-shadow:0 0 18px currentColor;opacity:.7}.s1{left:2vw;top:31vh;color:var(--c);font-size:30px}.s2{right:3vw;top:44vh;color:var(--p);font-size:36px}@media(max-width:800px){body{padding:14px}.mascot{width:70px;height:70px}.board{gap:5px}.cat{font-size:11px}.scores{grid-template-columns:1fr}.card{min-height:58vh}}
</style></head><body><span class="spark s1">✦</span><span class="spark s2">✿</span><div class="shell"><header class="head"><div><div class="brand">HMSA ARCADE</div><h1>ARCADE <span>CHALLENGE</span></h1><div class="sub">Pick a category. Take your shot. Score points for your department.</div></div><img class="mascot" src="../hmsa-arcade-turtle.png" alt="HMSA Arcade turtle" onerror="this.style.display='none'"></header>
<section id="boardScreen" class="screen active"><div id="board" class="board"></div></section>
<section id="questionScreen" class="screen"><div class="card"><div id="qcat" class="label"></div><div id="qpts" class="pts"></div><div id="qtext" class="q"></div><button id="reveal" class="primary">REVEAL ANSWER</button><button class="back" data-go="boardScreen">BACK TO BOARD</button></div></section>
<section id="answerScreen" class="screen"><div class="card"><div class="label">ANSWER REVEAL</div><div id="answerMeta" class="pts"></div><div id="answerText" class="answer"></div><div id="explain" class="explain"></div><button id="award" class="primary">AWARD POINTS</button></div></section>
<section id="awardScreen" class="screen"><div class="card"><div class="label">WHO GOT IT?</div><div id="awardPrompt" class="q" style="font-size:clamp(28px,3vw,48px)"></div><div id="deptButtons" class="depts"></div><div id="awardStatus" class="status" aria-live="polite"></div></div></section>
<section id="scoreScreen" class="screen"><div class="card"><div class="label">DEPARTMENT CUP UPDATED</div><div id="winner" class="winner"></div><div class="explain">Points added. Return to the board whenever you're ready.</div><button class="primary" data-go="boardScreen">BACK TO CHALLENGE BOARD</button></div></section>
<section class="cup"><div class="cuphead">🏆 DEPARTMENT CUP • LIVE ARCADE TOTAL</div><div id="scores" class="scores"></div></section></div>
<script>
const API='https://hmsa-arcade-api.megan-leung.workers.dev';
const cats=[
{name:'HMSA',qs:[['What does HMSA stand for?','Hawaii Medical Service Association',''],['HMSA is an independent licensee of what national association?','Blue Cross and Blue Shield Association',''],['True or false: HMSA serves members across Hawaiʻi.','True',''],['This slot is ready for an HMSA-specific medium-hard question.','Question to be finalized','The game flow is complete; final HMSA content can be swapped in later.'],['This slot is ready for the hardest HMSA question.','Question to be finalized','The game flow is complete; final HMSA content can be swapped in later.']]},
{name:'AI IRL',qs:[['What term describes realistic AI-generated video or audio impersonations?','Deepfakes',''],['What should you do before sharing a surprising AI-related claim online?','Verify it with reliable sources',''],['Name one everyday task where generative AI can help.','Examples include summarizing, drafting, brainstorming, or organizing.',''],['What is one risk of relying on an AI answer without checking it?','The answer may be inaccurate, incomplete, or invented.',''],['This slot is reserved for a fresh AI-in-the-news question.','Refresh before the event','Keeping one current slot makes the category timely without making the whole board expire.']]},
{name:'AI IN THE MOVIES',qs:[['Which Pixar robot crosses the galaxy while holding onto a small plant?','WALL-E',''],['What is the name of the AI computer in 2001: A Space Odyssey?','HAL 9000',''],['In Iron Man, what is the name of Tony Stark’s AI assistant?','JARVIS',''],['Which movie features an operating system named Samantha?','Her',''],['Which classic sci-fi franchise features the artificial intelligence Skynet?','The Terminator','']]},
{name:'AI LINGO',qs:[['What does AI stand for?','Artificial intelligence',''],['What do we call it when AI confidently gives false or invented information?','A hallucination',''],['What does LLM stand for?','Large language model',''],['What does “multimodal” mean in AI?','An AI system that can work with more than one type of input or output, such as text, images, or audio.',''],['What does GPT stand for?','Generative Pre-trained Transformer','']]}
];
const departments=['AMS','IT','COMMS'];let totals={AMS:0,IT:0,COMMS:0},used=new Set(),current=null;const screens=['boardScreen','questionScreen','answerScreen','awardScreen','scoreScreen'];const $=s=>document.querySelector(s);function show(id){screens.forEach(x=>$('#'+x).classList.toggle('active',x===id))}async function refreshScores(){try{const r=await fetch(API+'/scores');const j=await r.json();if(j.ok)totals={AMS:Number(j.totals.AMS||0),IT:Number(j.totals.IT||0),COMMS:Number(j.totals.COMMS||0)}}catch(e){console.warn(e)}drawScores()}function drawScores(){const ranked=departments.map(d=>({d,v:totals[d]})).sort((a,b)=>b.v-a.v);$('#scores').innerHTML=ranked.map((x,i)=>`<div class="score"><span>${i+1} · ${x.d}</span><b>${x.v.toLocaleString()}</b></div>`).join('')}function drawBoard(){const b=$('#board');b.innerHTML=cats.map(c=>`<div class="cat">${c.name}</div>`).join('');for(let r=0;r<5;r++)cats.forEach((c,i)=>{const id=i+'-'+r,x=document.createElement('button');x.className='tile'+(used.has(id)?' used':'');x.dataset.row=String(r);x.textContent=used.has(id)?'✦':(r+1)*100;x.onclick=()=>openQ(i,r);b.appendChild(x)})}function openQ(i,r){current={i,r,id:i+'-'+r,value:(r+1)*100,q:cats[i].qs[r],awardId:crypto.randomUUID()};$('#qcat').textContent=cats[i].name;$('#qpts').textContent=current.value+' POINTS';$('#qtext').textContent=current.q[0];show('questionScreen')}$('#reveal').onclick=()=>{$('#answerMeta').textContent=cats[current.i].name+' • '+current.value+' POINTS';$('#answerText').innerHTML='<b>ANSWER:</b> '+current.q[1];$('#explain').textContent=current.q[2]||'';show('answerScreen')};$('#award').onclick=()=>{$('#awardPrompt').textContent='Add '+current.value+' points to the Department Cup.';$('#awardStatus').textContent='';show('awardScreen')};const db=$('#deptButtons');departments.forEach(d=>{const x=document.createElement('button');x.className='dept';x.textContent=d;x.onclick=async()=>{const buttons=[...document.querySelectorAll('.dept')];buttons.forEach(b=>b.disabled=true);$('#awardStatus').textContent='ADDING POINTS…';try{const r=await fetch(API+'/award',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({award_id:current.awardId,department:d,score:current.value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Could not save award');used.add(current.id);await refreshScores();drawBoard();$('#winner').textContent='+'+current.value+' '+d+'!';show('scoreScreen')}catch(e){$('#awardStatus').textContent='POINTS NOT SAVED. TRY AGAIN.';buttons.forEach(b=>b.disabled=false)}};db.appendChild(x)});document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>show(x.dataset.go));drawBoard();refreshScores();setInterval(refreshScores,10000);
</script></body></html>
